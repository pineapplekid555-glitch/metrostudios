<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Staff | Metro Studios</title><meta name="robots" content="noindex"><meta name="theme-color" content="#0a0a0b">
<link rel="icon" href="../favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,100..900&display=swap">
<style>
:root{--bg:#0a0a0b;--panel:#141416;--line:#26262a;--tx:#ececec;--mut:#8d8d95;--ac:#f2f2f2;--red:#e5484d;--grn:#46a758;--amb:#f5a524}
@media(prefers-color-scheme:light){:root{--bg:#f6f6f4;--panel:#fff;--line:#dcdcd8;--tx:#121211;--mut:#6a6a70;--ac:#121211}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 Archivo,system-ui,sans-serif;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
a{color:inherit}.wrap{max-width:1100px;margin:0 auto;padding:0 18px}
header{border-bottom:1px solid var(--line)}header .wrap{display:flex;align-items:center;gap:14px;height:60px}
header b{letter-spacing:.02em}header .sp{flex:1}.who{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px}.who img{width:26px;height:26px;border-radius:50%}
h1{font-size:1.6rem;margin:26px 0 4px}h2{font-size:1.05rem;margin:0 0 10px}.mut{color:var(--mut)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;margin:18px 0;border-bottom:1px solid var(--line)}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);padding:10px 14px;font:inherit;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--tx);border-color:var(--ac)}
.btn{background:var(--ac);color:var(--bg);border:0;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.btn.line{background:none;color:var(--tx);border:1px solid var(--line)}.btn.sm{padding:4px 10px;font-size:13px}.btn.del{background:none;color:var(--red);border:1px solid var(--line)}
input,select,textarea{background:var(--bg);color:var(--tx);border:1px solid var(--line);padding:8px 10px;font:inherit;max-width:100%}
textarea{width:100%;min-height:70px}
.card{background:var(--panel);border:1px solid var(--line);padding:16px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:0 1 auto}.row .grow{flex:1 1 180px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.board{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));align-items:start}
.col h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:0 0 8px}
.it{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--mut);padding:10px 12px;margin-bottom:8px}
.it.high{border-left-color:var(--red)}.it.med{border-left-color:var(--amb)}.it.low{border-left-color:var(--grn)}
.it p{margin:4px 0;font-size:13px;color:var(--mut);white-space:pre-wrap}.it .t{font-weight:600}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);padding:0 6px;margin-right:4px;color:var(--mut)}
.tag.bug{color:var(--red);border-color:var(--red)}
.ann{border-bottom:1px solid var(--line);padding:10px 0}.ann:last-child{border:0}.ann p{margin:4px 0;white-space:pre-wrap}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top;font-size:14px}
label.chk{display:inline-flex;gap:4px;align-items:center;margin:0 10px 4px 0;font-size:13px}
pre{background:var(--bg);border:1px solid var(--line);padding:12px;overflow-x:auto;font-size:13px}
.card,.it{border-radius:10px}.btn,input,select,textarea{border-radius:8px}.btn{transition:opacity .15s,transform .1s}.btn:hover{opacity:.88}.btn:active{transform:scale(.98)}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}.stat b{display:block;font-size:1.6rem;line-height:1.2}.stat span{color:var(--mut);font-size:13px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.pill{border:1px solid var(--line);background:none;color:var(--mut);border-radius:99px;padding:7px 14px;font:inherit;cursor:pointer}
.pill[aria-pressed=true]{background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:600}.pill i{font-style:normal;opacity:.7;margin-left:6px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 16px}
.tgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.tc{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.tc.sel{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.th{position:relative;display:block;aspect-ratio:3/4;background:linear-gradient(135deg,#1d1d23,#2b2b35)}.th img{width:100%;height:100%;object-fit:cover;display:block}
.bd{position:absolute;left:8px;top:8px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:rgba(0,0,0,.7);color:#fff}
.bd.pending{background:var(--amb);color:#000}.bd.approved{background:#2f81f7;color:#fff}.bd.paid{background:var(--grn);color:#fff}
.pick{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.55);border-radius:8px;padding:5px 6px;display:flex}.pick input{width:20px;height:20px;margin:0;accent-color:#fff;cursor:pointer}
.tb{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}
.tt{font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-decoration:none}
.tm{color:var(--mut);font-size:12px}.tb .btn{width:100%;text-align:center;padding:10px}.tb .row .btn{flex:1}
.tb details summary{cursor:pointer;color:var(--mut);font-size:12px}.tb details .row{margin-top:6px}.tb details input{width:90px}
.bar{position:sticky;bottom:14px;z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--ac);border-radius:12px;padding:10px 14px;margin-top:16px;box-shadow:0 8px 30px rgba(0,0,0,.35)}.bar b{flex:1 1 auto}
.th.ph0{border:0;width:100%;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--mut);font:inherit}
.th.ph0 svg{width:46px;height:46px;opacity:.8}.th.ph0 span.w{font-size:13px}
.th.emb{aspect-ratio:auto;height:560px}.th.emb iframe{width:100%;height:100%;border:0;background:#000}
.search{flex:1 1 220px;min-width:160px}
.lnk{background:none;border:0;color:var(--tx);text-decoration:underline;cursor:pointer;font:inherit;font-size:12px;padding:0 4px}
.paygrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));margin-bottom:18px}
.pc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}.pc.due{border-color:var(--grn)}
.pc .ph{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.pc .amt{text-align:right}.pc .amt b{font-size:1.7rem;line-height:1.1;display:block}.pc .amt span{color:var(--mut);font-size:12px}
.pc details summary{cursor:pointer;color:var(--mut);font-size:13px}.li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}.li:last-child{border:0}
.hint{border:1px solid var(--amb);background:rgba(245,165,36,.08);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:14px}
form[data-form=camp] .cf{margin-top:8px}form[data-form=camp] .cf-chk{display:none}
form[data-form=camp][data-t=other] .cf-dm,form[data-form=camp][data-t=other] .cf-server,form[data-form=camp][data-t=dm] .cf-server,form[data-form=camp][data-t=dm] .cf-other,form[data-form=camp][data-t=server] .cf-dm,form[data-form=camp][data-t=server] .cf-other{display:none}
form[data-form=camp][data-t=dm] .cf-chk,form[data-form=camp][data-t=server] .cf-chk{display:block}
.pill{position:relative}#dupres.bad{color:#e5484d;font-weight:600}#dupres.ok{color:var(--grn);font-weight:600}
.nb{display:inline-block;min-width:18px;padding:1px 6px;margin-left:6px;border-radius:99px;background:var(--amb);color:#000;font-size:11px;font-weight:700;line-height:16px;text-align:center}
.todo{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.todo:last-child{border:0}.todo b{font-size:1.1rem}
.ok{color:var(--grn)}
.empty{text-align:center;padding:40px 10px;color:var(--mut)}
html{-webkit-text-size-adjust:100%}.tc{position:relative}.mobl{display:none}
nav.tabs{scrollbar-width:none;-webkit-overflow-scrolling:touch}nav.tabs::-webkit-scrollbar{display:none}
@media(max-width:640px){
 .wrap{padding:0 14px}h1{font-size:1.4rem}
 input,select,textarea{font-size:16px}
 .btn{min-height:44px}.btn.sm{min-height:40px;padding:8px 14px}
 nav.tabs{margin:14px -14px;padding:0 14px;position:sticky;top:0;z-index:6;background:var(--bg)}nav.tabs button{padding:13px 14px}
 .pill{padding:10px 14px}.tools>*{flex:1 1 auto}.tools .search{flex-basis:100%}
 .stats{grid-template-columns:1fr 1fr;gap:10px}.stat{padding:12px}.stat b{font-size:1.35rem}
 .tgrid{grid-template-columns:1fr 1fr;gap:10px}.tc:has(.emb){grid-column:1/-1}.th.emb{height:72vh;max-height:560px}
 .tb{padding:10px;gap:6px}.tb .btn{padding:10px 6px;font-size:14px}.tt{font-size:14px}.tm{font-size:11px}
 .tb details summary{padding:6px 0}.tb details input{width:100%}
 .bar{bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:10px}.bar .btn{flex:1}
 .paygrid{grid-template-columns:1fr}.pc{padding:14px}
 .card{padding:14px}.row>.btn,.row>button{flex:1 1 auto}
 table,table tbody,table tr,table td{display:block;width:100%}table tr:has(th){display:none}
 table tr{border-bottom:1px solid var(--line);padding:10px 0}table td{border:0;padding:4px 0}.mobl{display:block;font-size:12px}
 table td input[type=number]{width:100%!important}
 label.chk{margin:0 14px 8px 0}
 .it{padding:10px}
}
.center{max-width:460px;margin:12vh auto;text-align:center;padding:0 18px}.err{color:var(--red)}
</style></head><body>
<header><div class="wrap"><b>Metro Studios <span class="mut">/ Staff</span></b><span class="sp"></span><div class="who" id="who"></div></div></header>
<main class="wrap" id="app"><p class="mut" style="margin-top:30px">Loading…</p></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const API=location.pathname.replace(/staff(\/(index\.html)?)?$/,'')+'api/',NOAPI='NO_API';
const S={ttf:'all',sel:new Set(),q:'',watch:'',paylist:'',me:null,cfg:null,d:null,users:[],tab:'home',game:'',err:''};
async function api(p,m='GET',b){
  const r=await fetch(API+p,{method:m,headers:b?{'Content-Type':'application/json'}:{},body:b?JSON.stringify(b):undefined});
  const j=await r.json().catch(()=>null);
  if(j===null)throw new Error(r.status===404||r.status===405?NOAPI:'The server had a problem (HTTP '+r.status+'). Wait a few seconds and try again.');
  if(!r.ok)throw new Error(j.error||r.statusText);return j}
const gname=id=>(S.cfg.games.find(g=>g.id===id)||{name:'Studio'}).name;
const rname=id=>(S.cfg.roles.find(r=>r.id===id)||{name:id}).name;
const date=t=>new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const gOpts=(sel,all)=>(all?'<option value="">All games</option>':'')+S.cfg.games.filter(g=>S.me.games.includes(g.id)).map(g=>`<option value="${g.id}" ${g.id===sel?'selected':''}>${esc(g.name)}</option>`).join('');

async function boot(){
  try{const r=await api('me');S.me=r.user;S.cfg=r.config}catch(e){return e.message===NOAPI?noApiScreen():loginScreen(e.message==='Not logged in.'?'':e.message)}
  $('#who').innerHTML=`${S.me.avatar?`<img src="${esc(S.me.avatar)}" alt="">`:''}<span>${esc(S.me.name)}${S.me.owner?' (owner)':''}</span><a class="btn line sm" href="${API}logout">Log out</a>`;
  if(!S.me.access)return $('#app').innerHTML=`<div class="center"><h1>Almost there</h1><p class="mut">You are logged in as <b>${esc(S.me.name)}</b>, but you have not been given a game or role yet. Ask the owner to add you, then refresh this page.</p></div>`;
  await load();
}
function noApiScreen(){
  $('#who').innerHTML='';
  $('#app').innerHTML=`<div class="center"><h1>Staff login unavailable</h1><p class="mut">The staff area could not reach its login server. This usually means the site is being served from GitHub Pages, which cannot run the Discord login. Open the staff page on the Cloudflare Pages address instead.</p><p><a class="btn line" href="./">Try again</a></p></div>`}
function loginScreen(m){
  if(!m&&new URLSearchParams(location.search).has('denied'))m='Access is limited to Metro Studios staff. Join the Discord server and ask the owner for a staff role, then try again.';
  $('#who').innerHTML='';
  $('#app').innerHTML=`<div class="center"><h1>Staff area</h1><p class="mut">For Metro Studios team members. Log in with the Discord account the owner knows you by.</p>${m?`<p class="err">${esc(m)}</p>`:''}<a class="btn" href="${API}login">Log in with Discord</a></div>`}
async function load(){
  {const m=await api('me');S.me=m.user;S.cfg=m.config}
  S.d=await api('data');if(S.me.owner||S.me.lead)S.users=(await api('users')).users;
  S.tt=(await api('tiktoks')).tiktoks;S.camps=(await api('campaigns')).campaigns;if(S.me.owner)S.pay=(await api('payouts')).people;render()}
async function act(fn){try{S.err='';await fn();await load()}catch(e){S.err=e.message;render()}}

function render(){
  const tabs=[['home','Home'],['tasks','Tasks'],['bugs','Bugs'],['tiktoks','TikToks']];if(S.me.marketing)tabs.push(['marketing','Marketing']);tabs.push(['pay','Payments'],['links','Links'],['tools','Update writer']);
  if(S.me.owner)tabs.push(['admin','Admin']);else if(S.me.lead)tabs.push(['admin','My team']);
  const owe=S.me.owner?(S.pay||[]).filter(u=>u.owed||u.pending).length:0,bdg={tiktoks:S.me.owner?S.tt.filter(t=>t.claim&&t.claim.status==='pending').length:0,marketing:S.me.owner?S.camps.filter(c=>c.status==='pending').length:0,pay:owe};
  const body={home,tasks:()=>board('task'),bugs:()=>board('bug'),tiktoks,marketing,pay,links,tools,admin}[S.tab]();
  $('#app').innerHTML=`<h1>Hello, ${esc(S.me.name)}</h1><div class="mut">${S.me.owner?'Owner':S.me.games.map(gname).join(', ')}${S.me.roles.length?' · '+S.me.roles.map(rname).join(', '):''}</div>
  <nav class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${k===S.tab}" data-tab="${k}">${l}${bdg[k]?`<span class="nb">${bdg[k]}</span>`:''}</button>`).join('')}</nav>
  ${S.err?`<p class="err">${esc(S.err)}</p>`:''}${body}`}

function attention(){
  const me=S.me,rows=[];
  if(me.owner){
    const pt=S.tt.filter(t=>t.claim&&t.claim.status==='pending').length,pc=S.camps.filter(c=>c.status==='pending').length,owed=(S.pay||[]).reduce((n,u)=>n+u.owed,0),ow=(S.pay||[]).filter(u=>u.owed>0).length,un=S.tt.filter(t=>!t.claim).length;
    if(pt)rows.push([pt,'TikTok claims waiting for approval','tiktoks','Review']);
    if(pc)rows.push([pc,'Campaign claims waiting for approval','marketing','Review']);
    if(ow)rows.push([rbx(owed),`owed to ${ow} ${ow===1?'person':'people'}`,'pay','Pay']);
    if(un)rows.push([un,'TikToks nobody has claimed yet','tiktoks','View']);
  }else if(me.roles.includes('marketing')){
    const un=S.tt.filter(t=>!t.claim).length,mine=S.tt.filter(t=>t.claim&&t.claim.by===me.id);
    const ow=[...mine.filter(t=>t.claim.status==='approved').map(t=>t.claim.amount),...S.camps.filter(c=>c.by===me.id&&c.status==='approved').map(c=>c.amount)].reduce((n,x)=>n+(x||0),0);
    if(un)rows.push([un,'TikToks you can claim','tiktoks','Claim']);
    if(ow)rows.push([rbx(ow),'approved and waiting to be paid to you','pay','View']);
  }else return '';
  return `<div class="card"><h2>${me.owner?'Needs your attention':'For you'}</h2>${rows.length?rows.map(([n,l,tab,b])=>`<div class="todo"><span><b>${n}</b> <span class="mut">${l}</span></span><button class="btn line sm" data-tab="${tab}">${b}</button></div>`).join(''):'<p class="ok" style="margin:0">All clear. Nothing is waiting on you.</p>'}</div>`}

function home(){
  const mine=S.d.items.filter(i=>i.status!=='done'&&i.assignee&&i.assignee.toLowerCase()===S.me.name.toLowerCase());
  const open=S.d.items.filter(i=>i.status!=='done');
  const mgr=S.me.owner||S.me.lead,gSel=S.me.owner?`<option value="">${'Whole studio'}</option>`+S.cfg.games.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join(''):gOpts('');
  const ownerForm=mgr?`<form class="row" data-form="ann" style="margin-top:12px"><input class="grow" name="title" placeholder="Announcement title" required><select name="game">${gSel}</select><textarea name="text" placeholder="Message"></textarea><button class="btn">Post</button></form>`:'';
  return attention()+`<div class="grid"><div class="card"><h2>Your work</h2>${mine.length?mine.map(i=>`<div class="it ${i.priority}"><span class="t">${esc(i.title)}</span><br><span class="tag">${esc(gname(i.game))}</span><span class="tag">${i.status}</span></div>`).join(''):'<p class="mut">Nothing assigned to you. Items assigned to your Discord display name show here.</p>'}</div>
  <div class="card"><h2>Studio snapshot</h2>${S.me.games.map(g=>{const x=S.d.items.filter(i=>i.game===g);const o=x.filter(i=>i.status!=='done');return `<p><b>${esc(gname(g))}</b><br><span class="mut">${o.filter(i=>i.type==='task').length} open tasks · ${o.filter(i=>i.type==='bug').length} open bugs · ${x.length-o.length} done</span></p>`}).join('')}
  <p class="mut">Team: ${S.d.people.length} staff</p></div></div>
  <div class="card"><h2>Announcements</h2>${S.d.announcements.map(a=>`<div class="ann"><b>${esc(a.title)}</b> <span class="tag">${esc(gname(a.game))}</span><span class="mut"> ${date(a.created)}</span>${(S.me.owner||S.me.lead)?` <button class="btn del sm" data-del="announcements/${a.id}">Delete</button>`:''}<p>${esc(a.text)}</p></div>`).join('')||'<p class="mut">No announcements yet.</p>'}${ownerForm}</div>`}

function board(type){
  const items=S.d.items.filter(i=>i.type===type&&(!S.game||i.game===S.game));
  const cols=[['todo','To do'],['doing','In progress'],['done','Done']];
  const L=type==='bug'?'bug report':'task';
  return `<div class="card"><form class="row" data-form="item"><input type="hidden" name="type" value="${type}">
  <input class="grow" name="title" placeholder="New ${L}" required maxlength="120"><select name="game">${gOpts('')}</select>
  <select name="priority"><option value="med">Medium</option><option value="high">High</option><option value="low">Low</option></select>
  <input name="assignee" placeholder="Assign to (display name)" list="ppl"><datalist id="ppl">${S.d.people.map(p=>`<option value="${esc(p.name)}">`).join('')}</datalist>
  <textarea name="notes" placeholder="${type==='bug'?'Steps to reproduce, what you expected, what happened':'Details (optional)'}"></textarea><button class="btn">Add</button></form></div>
  <div class="row" style="margin-bottom:12px"><span class="mut">Filter:</span><select data-filter>${gOpts(S.game,true)}</select></div>
  <div class="board">${cols.map(([k,l],ci)=>`<div class="col"><h3>${l} (${items.filter(i=>i.status===k).length})</h3>${items.filter(i=>i.status===k).map(i=>`<div class="it ${i.priority}"><span class="t">${esc(i.title)}</span><br><span class="tag">${esc(gname(i.game))}</span><span class="tag ${i.type}">${i.priority}</span>${i.assignee?`<span class="tag">@${esc(i.assignee)}</span>`:''}${i.notes?`<p>${esc(i.notes)}</p>`:''}
  <div class="row" style="margin-top:6px">${ci>0?`<button class="btn line sm" data-move="${i.id}:${cols[ci-1][0]}">◀</button>`:''}${ci<2?`<button class="btn line sm" data-move="${i.id}:${cols[ci+1][0]}">▶</button>`:''}${S.me.owner||i.by===S.me.id?`<button class="btn del sm" data-del="items/${i.id}">Delete</button>`:''}</div></div>`).join('')}</div>`).join('')}</div>`}

const rbx=n=>'R$'+Number(n||0).toLocaleString();
const stTag=s=>`<span class="tag ${s==='rejected'?'bug':''}">${{pending:'Pending approval',approved:'Approved, awaiting payment',paid:'Paid',rejected:'Rejected'}[s]}</span>`;
const decide=(kind,id,o,note)=>S.me.owner?`<div class="row" style="margin-top:8px"><input id="amt-${id}" type="number" min="0" value="${o.amount||0}" style="width:96px" title="Robux">${note?`<input id="note-${id}" class="grow" placeholder="Note to staff (optional)" value="${esc(o.note||'')}">`:''}

  return head+(list.length?`<div class="tgrid">${list.map(card).join('')}</div>`:`<div class="empty">${f==='all'?'No TikToks yet. Add some above.':'Nothing here.'}</div>`)+bar}

function downloadCsv(){

  return `<div class="grid">${gr('games',S.cfg.games)}${gr('roles',S.cfg.roles)}</div>
  <div class="card"><h2>People</h2><p class="mut">Anyone who logs in with Discord appears here with no access until you tick a game or role.</p><table>
  ${S.users.map(u=>u.id===S.me.id?`<tr><td><b>${esc(u.name)}</b></td><td class="mut">Owner, full access</td><td></td></tr>`:`<tr data-user="${u.id}"><td><b>${esc(u.name)}</b><br><span class="mut">seen ${date(u.seen)}</span></td>
  <td>${S.cfg.games.map(g=>`<label class="chk"><input type="checkbox" data-g="${g.id}" ${u.games.includes(g.id)?'checked':''}>${esc(g.name)}</label>`).join('')}<br>${S.cfg.roles.map(r=>`<label class="chk"><input type="checkbox" data-r="${r.id}" ${u.roles.includes(r.id)?'checked':''}>${esc(r.name)}</label>`).join('')}</td>
  <td><button class="btn del sm" data-del="users/${u.id}" data-confirm="Remove ${esc(u.name)}?">Remove</button></td></tr>`).join('')}</table></div>`}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-del],[data-move],[data-copy],[data-claim],[data-decide],[data-payall],[data-sync],[data-ttf],[data-selall],[data-clearsel],[data-claimsel],[data-apprall],[data-appperson],[data-copypay],[data-copytext],[data-watch],[data-refresh],[data-setall],[data-cf],[data-checkdup],[data-csv],[data-hall],[data-appcamps]');if(!t)return;
  if(t.dataset.tab){e.preventDefault();S.tab=t.dataset.tab;S.err='';render()}
  else if(t.dataset.del){if(t.dataset.confirm&&!confirm(t.dataset.confirm))return;act(async()=>{const r=await api(t.dataset.del,'DELETE');if(r.games&&r.roles)S.cfg=r})}
  else if(t.dataset.move){const[id,st]=t.dataset.move.split(':');act(()=>api('items/'+id,'PATCH',{status:st}))}
  else if(t.dataset.claim){act(()=>api('tiktoks/'+t.dataset.claim+'/claim','POST',{}))}
  else if(t.dataset.decide){if(t.dataset.confirm&&!confirm(t.dataset.confirm))return;const[kind,id,action]=t.dataset.decide.split(':'),b={action,amount:$('#amt-'+id)?.value};if($('#note-'+id))b.note=$('#note-'+id).value;act(()=>api(kind+'/'+id,'PATCH',b))}
  else if(t.dataset.payall){if(t.dataset.confirm&&!confirm(t.dataset.confirm))return;act(()=>api('payouts','POST',{user:t.dataset.payall}))}
  else if(t.dataset.csv){downloadCsv()}
  else if(t.dataset.hall){S.hall=!S.hall;render()}
  else if(t.dataset.appcamps){if(!confirm(t.dataset.confirm))return;act(async()=>{for(const c of S.camps.filter(c=>c.status==='pending')){try{await api('campaigns/'+c.id,'PATCH',{action:'approve'})}catch(e){}}})}
  else if(t.dataset.cf){S.cf=t.dataset.cf;render()}
  else if(t.dataset.checkdup){const f=t.closest('form'),b=Object.fromEntries(new FormData(f)),o=$('#dupres');o.className='mut';o.textContent='Checking…';
    api('campaigns/check','POST',{type:b.ctype,username:b.username,serverName:b.serverName,invite:b.invite}).then(r=>{o.className=r.duplicate?'bad':'ok';o.textContent=r.duplicate?r.message:'Not claimed yet. You are good to go.'}).catch(x=>{o.className='bad';o.textContent=x.message})}
  else if(t.dataset.watch){S.watch=S.watch===t.dataset.watch?'':t.dataset.watch;render()}
  else if(t.dataset.appperson){act(()=>api('payouts','POST',{user:t.dataset.appperson,action:'approve'}))}
  else if(t.dataset.copypay){navigator.clipboard?.writeText(S.paylist);t.textContent='Copied'}
  else if(t.dataset.copytext){navigator.clipboard?.writeText(t.dataset.copytext);t.textContent='copied'}
  else if(t.dataset.setall){const n=$('#setall').value;act(async()=>{const r=await api('tiktoks/setamount','POST',{amount:n});alert('Updated '+r.count+' pending claim'+(r.count===1?'':'s')+' to R$'+n+'.')})}
  else if(t.dataset.refresh){act(async()=>{let ok=0;for(const x of S.tt.filter(x=>!x.thumb)){let got=false;try{const r=await api('tiktoks/'+x.id+'/refresh','POST',{});got=!!r.thumb}catch(e){}if(!got){try{const rr=await fetch('https://www.tiktok.com/oembed?url='+encodeURIComponent(x.url));if(rr.ok){const o=await rr.json();if(o.thumbnail_url){await api('tiktoks/'+x.id+'/details','POST',{title:o.title,author:o.author_name,thumb:o.thumbnail_url});got=true}}}catch(e){}}if(got)ok++}alert(ok?'Loaded '+ok+' preview'+(ok===1?'':'s')+'.':'TikTok did not return previews. You can still use Watch here on each card.')})}
  else if(t.dataset.ttf){S.ttf=t.dataset.ttf;render()}
  else if(t.dataset.selall){S.tt.filter(x=>!x.claim).forEach(x=>S.sel.add(x.id));render()}
  else if(t.dataset.clearsel){S.sel.clear();render()}
  else if(t.dataset.claimsel){act(async()=>{const bad=[];for(const id of [...S.sel]){try{await api('tiktoks/'+id+'/claim','POST',{})}catch(e){bad.push(e.message)}}S.sel.clear();if(bad.length)alert('Some could not be claimed:\n'+[...new Set(bad)].join('\n'))})}
  else if(t.dataset.apprall){if(!confirm(t.dataset.confirm))return;act(async()=>{for(const x of S.tt.filter(x=>x.claim&&x.claim.status==='pending')){try{await api('tiktoks/'+x.id,'PATCH',{action:'approve'})}catch(e){}}})}
  else if(t.dataset.sync){act(async()=>{const r=await api('tiktoks/discover','POST',{});if(!r.urls.length){alert('TikTok did not show any videos for @'+r.user+'. Paste the links in the box instead.');return}await addMany(r.urls)})}
  else if(t.dataset.copy){navigator.clipboard?.writeText($('#u-out').textContent);t.textContent='Copied'}});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  const b=Object.fromEntries(new FormData(f)),k=f.dataset.form;
  if(k==='tt')return act(async()=>{await addMany(b.urls.split(/\s+/).filter(Boolean))});
  if(k==='camp')return act(async()=>{
    const files=[...f.querySelector('[name=proofs]').files].slice(0,4),proofs=await Promise.all(files.map(shrink));
    await api('campaigns','POST',{type:b.ctype,title:b.title,username:b.username,serverName:b.serverName,invite:b.invite,description:b.description,links:(b.links||'').split('\n').map(x=>x.trim()).filter(Boolean),proofs});S.ct=b.ctype||'other'});
  const[path,m]={ann:['announcements'],item:['items'],link:['links'],games:['games'],roles:['roles'],tt:['tiktoks'],rates:['rates','PUT'],profile:['profile','PUT']}[k];
  act(async()=>{const r=await api(path,m||'POST',b);if(r.games&&r.roles)S.cfg=r;if(k==='profile')S.me.roblox=r.roblox})});
async function addMany(urls){
  urls=[...new Set(urls)];let added=0,dupes=0;const bad=[];
  for(const u of urls){try{await api('tiktoks','POST',{url:u});added++}catch(e){/already/i.test(e.message)?dupes++:bad.push(u+' ('+e.message+')')}}
  alert(`Added ${added}. Already on the list: ${dupes}.`+(bad.length?`\nCould not add:\n`+bad.join('\n'):''))}
async function shrink(file){const bm=await createImageBitmap(file),sc=Math.min(1,1280/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=Math.round(bm.width*sc);c.height=Math.round(bm.height*sc);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.8)}
document.addEventListener('change',e=>{
  if(e.target.dataset&&e.target.dataset.pick){const i=e.target.dataset.pick;e.target.checked?S.sel.add(i):S.sel.delete(i);render();return}
  if(e.target.name==='ctype'){const f=e.target.closest('form');S.ct=e.target.value;f.dataset.t=S.ct;f.querySelectorAll('.pill').forEach(l=>l.setAttribute('aria-pressed',String(l.contains(e.target))));const o=$('#dupres');if(o)o.textContent='';return}
  if(e.target.matches('[data-filter]')){S.game=e.target.value;render();return}
  const rr=e.target.closest('[data-rate]');
  if(rr){const g=k=>rr.querySelector(`[data-k=${k}]`).value;act(()=>api('rates','PUT',{user:rr.dataset.rate,tiktok:g('tiktok'),campaign:g('campaign')}));return}
  const row=e.target.closest('[data-user]');if(!row)return;
  const pick=a=>[...row.querySelectorAll(`[data-${a}]:checked`)].map(c=>c.dataset[a]);
  act(()=>api('users/'+row.dataset.user,'PUT',{games:pick('g'),roles:pick('r')}))});
document.addEventListener('input',e=>{if(e.target.id==='cq'){S.cq=e.target.value;render();const i=$('#cq');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}return}
  if(e.target.id==='tq'){S.q=e.target.value;render();const i=$('#tq');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}return}
  if(e.target.closest('#u-items,#u-title,#u-game'))buildUpdate()});
boot();
</script></body></html>
